<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign PDF Documents is installed</title>
<link rel="icon" href="assets/icon32.png">
<!-- Umami analytics (unique visit = install). Paste the script from cloud.umami.is here, e.g.:
<script defer src="https://cloud.umami.is/script.js" data-website-id="UMAMI_WEBSITE_ID"></script> -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font: 18px/1.45 Inter, "Segoe UI", Roboto, Arial, sans-serif; color: #1e1b2e; background: #f3f0fb; text-align: center; }
  main { padding: 22px 24px 32px; }
  h1 { margin: 0 0 8px; font-size: 32px; line-height: 1.2; font-weight: 700; }
  h1 img { width: 32px; height: 32px; vertical-align: -5px; margin-right: 8px; }
  .step { margin: 0 auto 14px; max-width: 980px; font-size: 20px; font-weight: 600; }
  .frame { display: inline-block; padding: 10px; background: #fff; border: 2px solid #6D28D9; border-radius: 14px; box-shadow: 0 10px 30px rgba(45, 20, 110, .18); }
  .frame img { display: block; width: min(960px, calc(100vw - 80px), calc((100vh - 170px) * 1.6)); height: auto; border-radius: 6px; border: 1px solid #d9d4e8; }
  .next { margin: 18px 0 0; font-size: 18px; color: #4a4560; }
</style>
</head>
<body>
<main>
  <h1><img src="assets/icon.svg" alt="">Thanks for installing Sign PDF Documents</h1>
  <p class="step">Click the puzzle piece in the top right of your browser, then click the pin next to Sign PDF Documents:</p>
  <div class="frame"><img src="assets/pin-steps.png" width="1280" height="800" alt="Chrome toolbar: 1 puzzle piece, 2 pin next to Sign PDF Documents, 3 the pinned icon"></div>
  <p class="next">Then click the icon and open your PDF.</p>
</main>
</body>
</html>
